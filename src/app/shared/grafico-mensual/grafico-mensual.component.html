<!-- Gasto mensual: una barra por mes; la del mes que se ve destaca y al tocar una se va a ese mes -->
<section class="vidrio rounded-2xl p-4 sm:p-6 flex flex-col flex-1" aria-labelledby="titulo-mensual">
  <div class="flex items-start justify-between gap-2 mb-2">
    <div>
      <h3 id="titulo-mensual" class="text-base sm:text-lg font-bold text-slate-900 dark:text-white">Gasto mensual</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400">{{ subtitulo() }}</p>
    </div>
    @if (promedio()) {
      <span class="text-[11px] font-medium px-2.5 py-1 rounded-full bg-indigo-500/15 text-indigo-700 dark:text-indigo-300 shrink-0 tabular-nums" title="Promedio de los meses con gastos">
        Prom. {{ promedio() | pesoChileno }}
      </span>
    }
  </div>

  @if (leyenda().length) {
    <div class="flex flex-wrap gap-x-3 gap-y-1 mb-3 text-[11px] text-slate-600 dark:text-slate-300">
      @for (item of leyenda(); track item.etiqueta) {
        <span class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-sm" [class]="item.clase ?? ''" [style.background-color]="item.color ?? null"></span>
          {{ item.etiqueta }}
        </span>
      }
    </div>
  }

  <div class="h-52 mt-auto flex items-end gap-1.5 sm:gap-3">
    @for (barra of barras(); track barra.mes; let i = $index) {
      <button type="button" (click)="seleccionar.emit(barra.mes)" [title]="descripcion(barra)" [attr.aria-label]="descripcion(barra)"
              [attr.aria-current]="barra.mes === mesSeleccionado() ? 'date' : null"
              class="group flex-1 h-full min-w-0 flex flex-col items-center justify-end gap-1 rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400/70">
        <span class="text-[10px] sm:text-[11px] tabular-nums leading-none whitespace-nowrap"
              [class]="barra.mes === mesSeleccionado() ? 'font-bold text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400'">
          {{ barra.total ? compacto(barra.total) : '' }}
        </span>
        <div class="relative w-full max-w-[56px] flex-1 flex flex-col justify-end">
          <!-- Barra apilada: los segmentos van de abajo hacia arriba -->
          <div class="crecer w-full flex flex-col-reverse rounded-lg overflow-hidden transition group-hover:brightness-110"
               [style.--i]="i"
               [style.height.%]="barra.total ? alto(barra.total) : 2"
               [class]="barra.mes === mesSeleccionado() ? 'shadow-lg shadow-indigo-500/40 ring-2 ring-indigo-400/70 dark:ring-indigo-300/60' : 'opacity-80'">
            @if (barra.total) {
              @for (segmento of barra.segmentos; track segmento.etiqueta) {
                @if (segmento.monto > 0) {
                  <div [class]="segmento.clase ?? ''" [style.background-color]="segmento.color ?? null"
                       [style.height.%]="(segmento.monto / barra.total) * 100"></div>
                }
              }
            } @else {
              <div class="h-full bg-slate-900/10 dark:bg-white/10"></div>
            }
          </div>
          @if (barra.limite) {
            <!-- Marca del límite (presupuesto) de ese mes -->
            <span class="absolute left-[-3px] right-[-3px] border-t-2 border-dashed border-slate-900/45 dark:border-white/60"
                  [style.bottom.%]="alto(barra.limite)" aria-hidden="true"></span>
          }
        </div>
        <span class="text-[11px] leading-none"
              [class]="barra.mes === mesSeleccionado() ? 'font-bold text-indigo-600 dark:text-indigo-300' : 'text-slate-500 dark:text-slate-400'">
          {{ nombreCorto(barra.mes) }}
        </span>
      </button>
    }
  </div>
</section>
