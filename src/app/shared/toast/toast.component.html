<div role="status" aria-live="polite"
     class="fixed bottom-6 left-6 z-50 transform transition-all duration-300 pointer-events-none vidrio-fuerte px-4 py-3 rounded-2xl text-slate-800 dark:text-slate-100 text-xs font-semibold flex items-center gap-2"
     [class.translate-y-20]="!toast().visible"
     [class.opacity-0]="!toast().visible">
  <span>{{ toast().icono }}</span>
  <span>{{ toast().mensaje }}</span>
</div>
