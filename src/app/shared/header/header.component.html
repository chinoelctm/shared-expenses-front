<!-- Barra superior: una píldora de vidrio flotando sobre el fondo -->
<header class="sticky top-0 z-30 px-2 sm:px-4 pt-2">
  <div class="vidrio-fuerte max-w-7xl mx-auto rounded-2xl min-h-14 flex flex-wrap md:flex-nowrap items-center justify-between gap-x-2 gap-y-1.5 px-1.5 sm:px-2.5 py-1.5">
    <div class="hidden sm:flex items-center gap-2.5 min-w-0">
      <span class="hidden sm:flex w-9 h-9 shrink-0 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 items-center justify-center text-white shadow-md shadow-indigo-500/30" aria-hidden="true">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      </span>
      <div class="hidden xl:block min-w-0">
        <h1 class="text-base font-bold text-slate-900 dark:text-white leading-tight tracking-tight">Gastos<span class="text-indigo-600 dark:text-indigo-400"> Compartidos</span></h1>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Reparto proporcional al aporte</p>
      </div>
    </div>

    <!-- Vistas: planilla compartida o gastos personales. En el teléfono ocupan su propia fila -->
    <nav class="order-last md:order-none w-full md:w-auto flex p-0.5 rounded-xl bg-white/60 dark:bg-white/[0.07] border border-white/70 dark:border-white/10" aria-label="Vistas">
      <a routerLink="/" routerLinkActive="activa" [routerLinkActiveOptions]="{ exact: true }" #compartidos="routerLinkActive"
         class="vista flex-1 md:flex-none flex items-center justify-center gap-1.5 h-9 px-3 rounded-lg text-sm font-semibold transition"
         [attr.aria-current]="compartidos.isActive ? 'page' : null">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        Compartidos
      </a>
      <a routerLink="/personales" routerLinkActive="activa" #personales="routerLinkActive"
         class="vista flex-1 md:flex-none flex items-center justify-center gap-1.5 h-9 px-3 rounded-lg text-sm font-semibold transition"
         [attr.aria-current]="personales.isActive ? 'page' : null">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        Personales
      </a>
    </nav>

    <!-- Mes: anterior, selector y siguiente -->
    <div class="flex flex-1 basis-0 md:flex-none md:basis-auto items-center bg-white/60 dark:bg-white/[0.07] p-0.5 rounded-xl border border-white/70 dark:border-white/10 min-w-0">
      <button type="button" (click)="navegacion().mesAnterior()" class="flex items-center justify-center w-9 h-9 rounded-lg hover:bg-white/80 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 transition-colors" title="Mes anterior" aria-label="Mes anterior">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </button>
      <select (change)="cambiarMes($event)" aria-label="Mes seleccionado" class="flex-1 md:flex-none min-w-0 bg-transparent border-0 text-sm font-semibold text-slate-800 dark:text-slate-100 pl-1.5 pr-7 py-1 outline-none focus:ring-2 focus:ring-indigo-400/60 rounded-lg cursor-pointer">
        @for (mes of navegacion().mesesDisponibles(); track mes) {
          <option [value]="mes" [selected]="mes === navegacion().mesSeleccionado()" class="text-slate-900">{{ mes | nombreMes }}</option>
        }
      </select>
      <button type="button" (click)="navegacion().mesSiguiente()" class="flex items-center justify-center w-9 h-9 rounded-lg hover:bg-white/80 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 transition-colors" title="Mes siguiente" aria-label="Mes siguiente">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

    <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
      <button type="button" (click)="navegacion().irAMesActual()" class="hidden md:flex items-center h-10 px-3 rounded-xl text-sm font-semibold text-indigo-700 dark:text-indigo-300 hover:bg-white/70 dark:hover:bg-white/10 transition-colors">Hoy</button>
      @if (!esPersonal()) {
        <button type="button" (click)="store.abrirModalArriendo()" class="hidden sm:flex items-center gap-1.5 h-10 px-3 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-white/70 dark:hover:bg-white/10 transition-colors" title="Modificar arriendo del mes">
          <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          <span class="hidden xl:inline">Arriendo</span>
          <strong class="tabular-nums">{{ store.resumen()?.rent | pesoChileno }}</strong>
        </button>
      }
      <button type="button" (click)="abrirConfiguracion()" class="flex items-center justify-center w-10 h-10 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-white/70 dark:hover:bg-white/10 transition-colors"
              [title]="esPersonal() ? 'Configuración personal' : 'Configuración'" [attr.aria-label]="esPersonal() ? 'Configuración personal' : 'Configuración'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>

      <!-- Sesión: avatar con iniciales y cerrar sesión -->
      <span class="hidden sm:flex w-px h-6 bg-slate-300/70 dark:bg-white/10 mx-0.5"></span>
      <span class="hidden sm:flex w-9 h-9 rounded-full bg-gradient-to-br from-amber-400 to-rose-500 text-white text-xs font-bold items-center justify-center ring-2 ring-white/70 dark:ring-white/15 shadow-sm"
            [title]="sesion.usuario()?.name ?? ''" aria-hidden="true">{{ iniciales() }}</span>
      <button type="button" (click)="cerrarSesion()" class="flex items-center justify-center gap-1.5 h-10 px-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-rose-500/10 hover:text-rose-600 dark:hover:text-rose-300 transition-colors"
              [title]="'Cerrar sesión de ' + (sesion.usuario()?.name ?? '')" aria-label="Cerrar sesión">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        <span class="hidden lg:inline">Salir</span>
      </button>
    </div>
  </div>
</header>
