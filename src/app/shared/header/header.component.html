<header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-800/95 backdrop-blur border-b border-slate-200 dark:border-slate-700 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold shadow-md shadow-blue-500/20 text-lg">{{ iniciales() }}</div>
      <div>
        <h1 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-tight">Gastos Compartidos</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Reparto equitativo proporcional</p>
      </div>
    </div>
    <div class="flex items-center gap-2 sm:gap-3">
      <div class="flex items-center bg-slate-100 dark:bg-slate-700/60 p-1 rounded-xl border border-slate-200 dark:border-slate-600">
        <button type="button" (click)="store.mesAnterior()" class="p-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 transition-colors" title="Mes anterior">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <select (change)="cambiarMes($event)" aria-label="Mes seleccionado" class="bg-transparent border-0 text-sm font-semibold text-slate-800 dark:text-slate-200 px-2 py-1 pr-8 outline-none focus:ring-0 cursor-pointer">
          @for (mes of store.mesesDisponibles(); track mes) {
            <option [value]="mes" [selected]="mes === store.mesSeleccionado()" class="text-slate-900">{{ mes | nombreMes }}</option>
          }
        </select>
        <button type="button" (click)="store.mesSiguiente()" class="p-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 transition-colors" title="Mes siguiente">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
      <button type="button" (click)="store.irAMesActual()" class="hidden md:inline-flex items-center px-2.5 py-1.5 text-xs font-semibold rounded-lg text-blue-700 bg-blue-50 dark:bg-blue-950/60 dark:text-blue-300 border border-blue-200 dark:border-blue-800 hover:bg-blue-100 transition-colors">Hoy</button>
      <button type="button" (click)="store.abrirModalArriendo()" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl bg-amber-50 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border border-amber-200 dark:border-amber-800 hover:bg-amber-100 transition-colors" title="Modificar Arriendo">
        <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span>Arriendo Mes: <strong>{{ store.resumen()?.rent | pesoChileno }}</strong></span>
      </button>
      <button type="button" (click)="store.abrirModalConfiguracion()" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 transition-colors" title="Configuración">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>

      <!-- Sesión: nombre del usuario y cerrar sesión -->
      <span class="hidden xl:inline text-sm font-medium text-slate-600 dark:text-slate-300 truncate max-w-[10rem]" [title]="sesion.usuario()?.username ?? ''">
        {{ sesion.usuario()?.name }}
      </span>
      <button type="button" (click)="cerrarSesion()" class="flex items-center gap-1.5 p-2 lg:px-3 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 dark:hover:bg-rose-950/50 dark:hover:text-rose-300 transition-colors"
              [title]="'Cerrar sesión de ' + (sesion.usuario()?.name ?? '')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        <span class="hidden lg:inline">Salir</span>
      </button>
    </div>
  </div>
</header>
