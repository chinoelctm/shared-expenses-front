<div class="m-auto w-full max-w-sm px-4 py-10">
  <div class="flex flex-col items-center gap-3 mb-6">
    <span class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-blue-500/20">GC</span>
    <h1 class="font-bold text-2xl tracking-tight text-slate-900 dark:text-white">Gastos Compartidos</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400">Inicia sesión para ver la planilla</p>
  </div>

  <form (submit)="entrar($event, usuario.value, clave.value)" novalidate
        class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm p-6 flex flex-col gap-4">
    @if (expirada && !error()) {
      <p class="flex items-start gap-2 text-sm rounded-xl px-3 py-2 bg-amber-50 text-amber-800 border border-amber-200 dark:bg-amber-950/50 dark:text-amber-300 dark:border-amber-900" role="status">
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Tu sesión expiró. Vuelve a ingresar.</span>
      </p>
    }

    <div class="flex flex-col gap-1.5">
      <label for="usuario" class="text-xs font-bold uppercase text-slate-700 dark:text-slate-300">Usuario</label>
      <div class="relative flex items-center">
        <svg class="absolute left-3 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <input #usuario id="usuario" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required
               [disabled]="enviando()" (input)="error.set(null)"
               class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none disabled:opacity-60">
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="clave" class="text-xs font-bold uppercase text-slate-700 dark:text-slate-300">Contraseña</label>
      <div class="relative flex items-center">
        <svg class="absolute left-3 w-4 h-4 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        <input #clave id="clave" name="password" [type]="mostrarClave() ? 'text' : 'password'" autocomplete="current-password" required
               [disabled]="enviando()" (input)="error.set(null)"
               class="w-full pl-9 pr-11 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none disabled:opacity-60">
        <button type="button" (click)="mostrarClave.set(!mostrarClave())" class="absolute right-1 flex items-center justify-center w-9 h-9 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                [attr.aria-pressed]="mostrarClave()" [title]="mostrarClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          @if (mostrarClave()) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          }
        </button>
      </div>
    </div>

    @if (error()) {
      <p class="flex items-start gap-2 text-sm rounded-xl px-3 py-2 bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-950/50 dark:text-rose-300 dark:border-rose-900" role="alert">
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>{{ error() }}</span>
      </p>
    }

    <button type="submit" [disabled]="enviando()"
            class="flex items-center justify-center gap-2 h-11 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-bold text-sm shadow-md shadow-blue-500/20 transition">
      @if (enviando()) {
        <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span>Ingresando…</span>
      } @else {
        <span>Ingresar</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      }
    </button>

    @if (despertando()) {
      <p class="text-xs text-center text-slate-500 dark:text-slate-400" role="status">
        El servidor estaba en reposo y está despertando; puede tardar hasta un minuto.
      </p>
    }
  </form>
</div>
