<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
  <app-resumen-kpi />
  <app-distribucion-categorias />
  <app-tabla-gastos />
</main>

<!-- Botón flotante (+) -->
<button type="button" (click)="store.abrirModalNuevoGasto()" class="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white shadow-xl shadow-blue-600/40 flex items-center justify-center transition-all duration-200" title="Agregar nuevo gasto">
  <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
</button>

@switch (store.modalAbierto()) {
  @case ('arriendo') {
    <app-modal-arriendo />
  }
  @case ('gasto') {
    <app-modal-gasto />
  }
  @case ('configuracion') {
    <app-modal-configuracion />
  }
}
