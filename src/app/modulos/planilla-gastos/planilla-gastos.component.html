<main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-5 sm:py-6 space-y-4 sm:space-y-5">
  <!-- Saludo y acciones -->
  <div class="entrada flex flex-col md:flex-row md:items-end md:justify-between gap-3" style="--i: 0">
    <div>
      <p class="text-xs font-semibold text-indigo-600 dark:text-indigo-300 uppercase tracking-wider">{{ store.mesSeleccionado() | nombreMes }}</p>
      <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white tracking-tight mt-1">{{ saludo() }}</h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">Así van los gastos compartidos del mes: totales, pagos y lo último que se registró.</p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" (click)="store.abrirModalNuevoGasto()" class="boton-principal flex items-center justify-center gap-2 h-11 px-4 rounded-xl text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
        <span>Nuevo Gasto</span>
      </button>
      <button type="button" (click)="store.abrirModalConfiguracion()" class="vidrio levantar flex items-center justify-center gap-2 h-11 px-3.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200" title="Personas, arriendo, categorías y costos fijos">
        <svg class="w-5 h-5 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
        <span class="hidden sm:inline">Configuración</span>
      </button>
    </div>
  </div>

  <app-resumen-kpi />
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-5">
    <app-grafico-mensual class="lg:col-span-2 entrada" style="--i: 6"
                         [barras]="barrasMensuales()" [mesSeleccionado]="store.mesSeleccionado()" [leyenda]="leyendaMensual"
                         subtitulo="Total de cada mes (con arriendo) · toca una barra para ir a ese mes"
                         (seleccionar)="store.cambiarMes($event)" />
    <app-ultimos-gastos class="entrada" style="--i: 7" [ultimos]="store.ultimosGastos()"
                        (editar)="editarReciente($event)" (nuevo)="store.abrirModalNuevoGasto()" />
  </div>
  <app-distribucion-categorias class="block entrada" style="--i: 9" [resumen]="store.resumen()?.categories ?? []" [total]="store.resumen()?.total" />
  <app-tabla-gastos class="block entrada" style="--i: 10" />
</main>

<!-- Botón flotante (+) -->
<button type="button" (click)="store.abrirModalNuevoGasto()" class="boton-principal fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full active:scale-95 flex items-center justify-center" title="Agregar nuevo gasto" aria-label="Agregar nuevo gasto">
  <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
</button>

@switch (store.modalAbierto()) {
  @case ('arriendo') {
    <app-modal-arriendo />
  }
  @case ('gasto') {
    <app-modal-gasto />
  }
  @case ('configuracion') {
    <app-modal-configuracion />
  }
}
